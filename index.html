
<!DOCTYPE html>
<!-- Exercice1 -->
<html>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene>
      <!-- Plan de base -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>

      <!-- Boîte 1 -->
      <a-box position="-2 2 -2" color="blue" width="1" height="1" depth="1"></a-box>

      <!-- Boîte 2 -->
      <a-box position="0 2 0" color="purple" width="1" height="1" depth="1"></a-box>

      <!-- Boîte 3 -->
      <a-box position="2 2 2" color="red" width="1" height="1" depth="1"></a-box>

    

      <!-- Caméra : hauteur 10, distance 15, orientée vers le centre du plan -->
      <a-entity position="0 10 15" rotation="-33 0 0">
        <a-camera></a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
