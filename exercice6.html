<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      #ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 999; display: none; }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div id="ui">
      <input type="range" min="0.1" max="3.0" step="0.1" value="1" oninput="box.setAttribute('scale', this.value+' '+this.value+' '+this.value)">
      <button onclick="box.setAttribute('material', 'color', 'red')">Rouge</button>
      <button onclick="box.setAttribute('material', 'color', 'green')">Vert</button>
      <button onclick="box.setAttribute('material', 'color', 'blue')">Bleu</button>
      <button onclick="box.setAttribute('material', 'color', 'purple')">Purple</button>
      <button onclick="box.setAttribute('material', 'color', 'orange')">Orange</button>
      <button onclick="box.setAttribute('material', 'color', 'yellow')">Yellow</button>
      <button onclick="box.setAttribute('material', 'color', 'grey')">Grey</button>
      <button onclick="box.setAttribute('material', 'color', 'black')">Black</button>
      <button onclick="box.setAttribute('material', 'color', 'white')">white</button>
    </div>

    <a-scene embedded arjs>
      <a-marker preset="hiro" id="marker">
        <a-box id="box" position="0 0.5 0" material="color: red;"></a-box>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const marker = document.querySelector('#marker');
      const ui = document.querySelector('#ui');
      const box = document.querySelector('#box');

      marker.addEventListener('markerFound', () => ui.style.display = 'block');
      marker.addEventListener('markerLost', () => ui.style.display = 'none');
    </script>
  </body>
</html>
